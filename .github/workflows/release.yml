name: Release

# Merging a PR into main produces a push to main, so this is the release
# trigger. The tag comes from `version` in the root package.json.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Read version from package.json ─────────────────────────────────────────
  version:
    name: Get version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - id: ver
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # Merging to main without bumping package.json would rebuild every
      # platform and then silently overwrite the existing Release's assets.
      # Warn and skip instead, so a no-op merge costs nothing.
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Release ${{ steps.ver.outputs.tag }} already exists. Bump \`version\` in package.json to publish a new release — skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build all platforms (Windows, Linux, macOS) ────────────────────────────
  build:
    name: Build installers
    needs: version
    if: needs.version.outputs.exists == 'false'
    uses: ./.github/workflows/build.yml

  # ── Publish GitHub Release ─────────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'

    steps:
      # merge-multiple flattens every installers-* artifact into dist/, so the
      # latest*.yml and *.blockmap files land here too. Without them the
      # in-app electron-updater has no feed to read and every update check
      # fails silently.
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: CypherShell ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
