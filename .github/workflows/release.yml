name: Release

# Merging a PR into main produces a push to main, so this is the release
# trigger. The tag comes from `version` in the root package.json.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Read version from package.json ─────────────────────────────────────────
  version:
    name: Get version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - id: ver
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # Merging to main without bumping package.json would rebuild every
      # platform and then silently overwrite the existing Release's assets.
      # Warn and skip instead, so a no-op merge costs nothing.
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Release ${{ steps.ver.outputs.tag }} already exists. Bump \`version\` in package.json to publish a new release — skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build all platforms (Windows, Linux, macOS) ────────────────────────────
  build:
    name: Build installers
    needs: version
    if: needs.version.outputs.exists == 'false'
    uses: ./.github/workflows/build.yml

  # ── Publish GitHub Release ─────────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'

    steps:
      # merge-multiple flattens every installers-* artifact into dist/, so the
      # latest*.yml and *.blockmap files land here too. Without them the
      # in-app electron-updater has no feed to read and every update check
      # fails silently.
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: CypherShell ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          # Prepended to the generated notes. Every platform's assets land in one
          # flat list, and the updater metadata (*.yml, *.blockmap) cannot be
          # renamed to disambiguate them — electron-updater fetches those exact
          # filenames. So the mapping is spelled out here instead.
          body: |
            ## Downloads

            Pick the file for your platform. The `-x64` / `-arm64` suffix is the CPU
            architecture — Apple Silicon Macs are `arm64`, Intel Macs are `x64`.

            | Platform | File |
            | --- | --- |
            | Windows | `CypherShell-*-windows-x64-setup.exe` |
            | macOS (Apple Silicon) | `CypherShell-*-macos-arm64.dmg` |
            | macOS (Intel) | `CypherShell-*-macos-x64.dmg` |
            | Linux | `CypherShell-*-linux-x64.AppImage` (portable) or `...-linux-x64.deb` (Debian/Ubuntu) |

            The `.zip` files are the **auto-update** payloads, not manual downloads —
            `electron-updater` needs them to install a macOS update, since it cannot
            install from a `.dmg`. Likewise `latest.yml`, `latest-linux.yml`,
            `latest-mac.yml` and the `.blockmap` files are read by the in-app updater;
            you never download them by hand.

            **macOS:** builds are unsigned, so Gatekeeper blocks the first launch. The
            Control-click → **Open** override was removed in macOS 15, so instead open
            **System Settings → Privacy & Security**, scroll to the **Security** section,
            and click **Open Anyway** for CypherShell. Or, in Terminal:
            `xattr -dr com.apple.quarantine /Applications/CypherShell.app`.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
