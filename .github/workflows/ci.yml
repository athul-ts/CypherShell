name: CI

# BL-37: runs for every branch that feeds the release line. Also called by
# release.yml, so a Release cannot start unless these jobs pass.
on:
  push:
    branches: [ats]
  pull_request:
    branches: [ats, features, dev, qa, main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, Lint & Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: typecheck and lint do not need the Electron binary.
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit backend (production, high and above)
        run: npm audit --omit=dev --audit-level=high --prefix backend

      - name: Audit root (critical)
        run: npm audit --audit-level=critical

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # better-sqlite3 ships a prebuilt binary (ADR-003): no rebuild step.
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run backend tests
        run: npm run test:backend

      - name: Run renderer tests
        run: npm run test:renderer

  e2e:
    name: End-to-end (Electron)
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Plain `npm ci`: postinstall runs install-electron, which downloads the binary.
      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Build the app
        run: npm run build:e2e

      - name: Run e2e tests
        run: xvfb-run -a npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test-results/
            tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7
