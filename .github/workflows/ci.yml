name: CI

on:
  pull_request:
    branches: [features, dev, qa, main]

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies (skip native rebuilds)
        run: npm ci --ignore-scripts

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
