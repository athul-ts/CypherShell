version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: ats
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Electron majors are upgraded by hand (native modules, preload, safeStorage).
      - dependency-name: electron
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /backend
    target-branch: ats
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: ats
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
