appId: com.cyphershell.app
productName: CypherShell
copyright: Copyright © 2026 CypherShell
afterPack: scripts/after-pack.cjs
directories:
  buildResources: build
files:
  # Whitelist: only include the compiled electron-vite output and the package manifest.
  # Everything else (src/, backend/, node_modules/, specs/, .claude/, etc.) is excluded.
  - out/**/*
  - package.json
extraResources:
  - from: backend/dist
    to: backend/dist
    filter:
      - '**/*'
  - from: backend/package.json
    to: backend/package.json
  - from: backend/prisma
    to: backend/prisma
    filter:
      - 'schema.prisma'
      - 'migrations/**'
  # Native modules — cannot be bundled by esbuild
  - from: backend/node_modules/better-sqlite3
    to: backend/node_modules/better-sqlite3
    filter:
      - '**/*'
      - '!**/test/**'
      - '!**/*.md'
  # better-sqlite3 loads its .node via require('bindings') at runtime;
  # bindings in turn requires file-uri-to-path
  - from: backend/node_modules/bindings
    to: backend/node_modules/bindings
    filter:
      - '**/*'
      - '!**/*.md'
  - from: backend/node_modules/file-uri-to-path
    to: backend/node_modules/file-uri-to-path
    filter:
      - '**/*'
      - '!**/*.md'
  - from: backend/node_modules/ssh2
    to: backend/node_modules/ssh2
    filter:
      - '**/*'
      - '!**/test/**'
      - '!**/*.md'
  - from: backend/node_modules/cpu-features
    to: backend/node_modules/cpu-features
    filter:
      - '**/*'
  # ssh2 is left external by esbuild, so its runtime dependency tree must
  # ship in node_modules too: asn1 → safer-buffer, bcrypt-pbkdf → tweetnacl
  - from: backend/node_modules/asn1
    to: backend/node_modules/asn1
    filter:
      - '**/*'
      - '!**/*.md'
  - from: backend/node_modules/safer-buffer
    to: backend/node_modules/safer-buffer
    filter:
      - '**/*'
      - '!**/*.md'
  - from: backend/node_modules/bcrypt-pbkdf
    to: backend/node_modules/bcrypt-pbkdf
    filter:
      - '**/*'
      - '!**/*.md'
  - from: backend/node_modules/tweetnacl
    to: backend/node_modules/tweetnacl
    filter:
      - '**/*'
      - '!**/*.md'
  # Prisma client runtime. Migrations are applied at runtime directly via
  # better-sqlite3 (see backend/src/config/db.ts), so the Prisma CLI and the
  # schema engine are NOT shipped — only the @prisma/client query runtime and
  # the better-sqlite3 driver adapter are needed.
  - from: backend/node_modules/@prisma
    to: backend/node_modules/@prisma
    filter:
      - '**/*'
      - '!**/test/**'
      - '!**/*.md'
      # Prisma Studio — web UI for DB browsing, not needed in production
      - '!studio-core/**'
      # Dev tooling — only for local development
      - '!dev/**'
      # Schema engine + fetch/config — only needed for `migrate`/introspect,
      # which we no longer run at runtime (migrations applied via better-sqlite3)
      - '!engines/**'
      - '!fetch-engine/**'
      - '!config/**'
      # Non-SQLite WASM query compilers in @prisma/client/runtime (60 MB+).
      # CypherShell uses only SQLite; mysql/postgresql/cockroachdb/sqlserver
      # WASM files are never loaded at runtime.
      - '!client/runtime/*mysql*'
      - '!client/runtime/*postgresql*'
      - '!client/runtime/*cockroachdb*'
      - '!client/runtime/*sqlserver*'
      # Source maps are never needed at runtime
      - '!client/runtime/*.map'
  - from: backend/node_modules/.prisma
    to: backend/node_modules/.prisma
    filter:
      - '**/*'
asarUnpack:
  - resources/**
  # Backend native binaries must not be inside the asar archive
  - backend/node_modules/better-sqlite3/**
  - backend/node_modules/.prisma/**
  - backend/node_modules/ssh2/**
  - backend/node_modules/cpu-features/**
win:
  executableName: CypherShell
  icon: build/icon.ico
  forceCodeSigning: false
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
mac:
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  maintainer: CypherShell
  category: Network
appImage:
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: athul-ts
  repo: CypherShell
